<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyBuddy AI</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--ac:#3b5bdb;--ok:#2b8a3e;--bad:#c92a2a;--bd:#e2e0d8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--card:#222228;--tx:#ececec;--mut:#9a9aa3;--ac:#748ffc;--ok:#69db7c;--bad:#ff8787;--bd:#33333b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16161a;--card:#222228;--tx:#ececec;--mut:#9a9aa3;--ac:#748ffc;--ok:#69db7c;--bad:#ff8787;--bd:#33333b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
textarea{width:100%;min-height:150px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{font:inherit;padding:9px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.fc{cursor:pointer;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center}
.mut{color:var(--mut);font-size:14px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--bad);color:var(--bad)}
ul{padding-left:20px;margin:6px 0}
.err{color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>📚 StudyBuddy AI</h1>
<p class="sub">Paste lecture notes or a textbook passage. An LLM turns it into a summary, flashcards or a quiz.</p>
<textarea id="src" placeholder="Paste your notes here (a few paragraphs works best)…"></textarea>
<div class="row" id="modes">
  <button data-m="summary" class="on">📝 Summary</button>
  <button data-m="cards">🃏 Flashcards</button>
  <button data-m="quiz">❓ Quiz</button>
  <button id="demo">Try sample text</button>
</div>
<button class="p" id="go">Generate</button>
<div id="out"></div>
<p class="mut">AI can make mistakes. Check the output against your course material.</p>
</main>
<script>
const $=id=>document.getElementById(id);
let mode="summary";
const SAMPLE="Photosynthesis is the process by which plants, algae and some bacteria convert light energy into chemical energy. It takes place in chloroplasts, which contain chlorophyll. In the light-dependent reactions, light splits water, releasing oxygen and producing ATP and NADPH. In the Calvin cycle, which happens in the stroma, the plant uses ATP and NADPH to fix carbon dioxide into glucose. The overall equation is 6CO2 + 6H2O + light → C6H12O6 + 6O2.";
document.querySelectorAll("#modes [data-m]").forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;
  document.querySelectorAll("#modes [data-m]").forEach(x=>x.classList.toggle("on",x===b));
});
$("demo").onclick=()=>{$("src").value=SAMPLE};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));


$("go").onclick=async()=>{
  const text=$("src").value.trim();
  if(text.length<40){ $("out").innerHTML='<div class="card err">Please paste a bit more text first.</div>'; return; }
  $("go").disabled=true; $("out").innerHTML='<div class="card mut">Thinking…</div>';
  try{
    const res=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode,text})});
    const r=await res.json();
    if(!res.ok) throw new Error(r.error||"Request failed");
    render(r);
  }catch(e){
    $("out").innerHTML='<div class="card err">'+esc(e.message||"Couldn’t generate. Please try again.")+'</div>';
  }
  $("go").disabled=false;
};

function render(r){
  const o=$("out");
  if(mode==="summary"){
    o.innerHTML='<div class="card"><h3>'+esc(r.title||"Summary")+'</h3><ul>'+(r.bullets||[]).map(b=>'<li>'+esc(b)+'</li>').join("")+'</ul></div>'+
    '<div class="card"><b>Key terms</b><ul>'+(r.keyTerms||[]).map(t=>'<li><b>'+esc(t.term)+':</b> '+esc(t.def)+'</li>').join("")+'</ul></div>';
  }else if(mode==="cards"){
    const cs=r.cards||[]; let i=0, back=false;
    const draw=()=>{o.innerHTML='<div class="card fc" id="fc">'+esc(back?cs[i].a:cs[i].q)+'</div><div class="row"><button id="pv">←</button><button id="nx">→</button><span class="mut" style="align-self:center">Card '+(i+1)+' of '+cs.length+' · tap card to flip</span></div>';
      $("fc").onclick=()=>{back=!back;draw()};
      $("pv").onclick=()=>{i=(i-1+cs.length)%cs.length;back=false;draw()};
      $("nx").onclick=()=>{i=(i+1)%cs.length;back=false;draw()};};
    cs.length?draw():o.innerHTML='<div class="card err">No cards returned.</div>';
  }else{
    const qs=r.questions||[]; let score=0, done=0;
    o.innerHTML='<div id="sc" class="mut">Score: 0 / '+qs.length+'</div>';
    qs.forEach((q,qi)=>{
      const d=document.createElement("div"); d.className="card";
      d.innerHTML='<b>'+(qi+1)+'. '+esc(q.q)+'</b>';
      const why=document.createElement("div"); why.className="mut"; why.style.marginTop="8px";
      q.options.forEach((t,oi)=>{
        const b=document.createElement("button"); b.className="opt"; b.textContent=t;
        b.onclick=()=>{
          if(d.dataset.done) return; d.dataset.done=1; done++;
          const ok=oi===q.answer; if(ok) score++;
          b.classList.add(ok?"ok":"bad");
          if(!ok) d.querySelectorAll(".opt")[q.answer].classList.add("ok");
          why.textContent=q.why||""; $("sc").textContent="Score: "+score+" / "+qs.length+(done===qs.length?" 🎉":"");
        };
        d.appendChild(b);
      });
      d.appendChild(why); o.appendChild(d);
    });
  }
}
</script>
</body>
</html>
